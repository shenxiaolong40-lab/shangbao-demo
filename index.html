<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>投保权益激活</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }

body {
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  background: linear-gradient(135deg, #1a0a2e 0%, #0d1a3a 50%, #0a2a1a 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* ── 手机壳 ── */
.phone {
  width: 375px;
  height: 780px;
  background: linear-gradient(180deg, #fff9f0 0%, #fff5e8 40%, #fff 100%);
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 32px 80px rgba(0,0,0,0.45), 0 4px 20px rgba(0,0,0,0.2);
}

/* ── 第一屏图片容器 ── */
.screen-img-wrap {
  position: absolute;
  inset: 0;
  z-index: 1;
  filter: blur(0px);
  transition: filter 0.3s ease;
}
.screen-img-wrap.blurred { filter: blur(2px); }
.screen-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
}
/* 透明热区：覆盖图片中「立即体验」按钮的位置 */
.img-btn-hotspot {
  position: absolute;
  /* 图片原尺寸 638×1356，手机壳 375×780
     按钮在原图约 y:860~940 / 1356 → 手机壳内 y ≈ 494~541px
     x: 60~578 / 638 → 手机壳内 x ≈ 35~340px */
  top: 407px; left: 42px; right: 42px; height: 38px;
  cursor: pointer;
  z-index: 2;
  border-radius: 25px;
  background: transparent;
}

/* ── 页面内容（背景） ── */
.page-content {
  position: absolute;
  top: 88px; /* 状态栏44 + 导航栏44 */
  left: 0; right: 0; bottom: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: #f7f7f7;
  filter: blur(0px);
  transition: filter 0.3s ease;
  /* 隐藏滚动条 */
  scrollbar-width: none;
}
.page-content::-webkit-scrollbar { display: none; }
.page-content.blurred { filter: blur(2px); }

/* ── 第一屏：白色内容区 ── */
.detail-wrap {
  background: #fff;
  padding: 14px 16px 0;
}

/* 品牌行 */
.brand-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 8px;
}
.brand-badge {
  background: #E8001C;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  letter-spacing: 0.3px;
}
.brand-name {
  font-size: 11px;
  color: #888;
}
.brand-sep { color: #ccc; font-size: 11px; }

/* 大标题 */
.detail-title {
  font-size: 26px;
  font-weight: 900;
  color: #111;
  line-height: 1.25;
  margin-bottom: 5px;
  letter-spacing: -0.5px;
}
.detail-sub {
  font-size: 11px;
  color: #999;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-sub-sep { color: #ddd; }

/* 权益卡片 */
.benefit-card {
  border: 1.5px solid #FFE0B2;
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  background: #fff;
}
.benefit-card-header {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 10px;
}
.benefit-card-icon {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FF6B00, #FF9500);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #fff; font-weight: 800;
  flex-shrink: 0;
}
.benefit-card-title {
  font-size: 14px;
  font-weight: 700;
  color: #111;
}
.benefit-card-sub {
  font-size: 11px;
  color: #999;
  margin-top: 1px;
}
.benefit-stats {
  display: flex;
  gap: 0;
}
.benefit-stat {
  flex: 1;
  text-align: center;
  position: relative;
}
.benefit-stat + .benefit-stat::before {
  content: '';
  position: absolute;
  left: 0; top: 4px; bottom: 4px;
  width: 1px;
  background: #f0f0f0;
}
.benefit-stat-num {
  font-size: 17px;
  font-weight: 800;
  color: #E8001C;
  line-height: 1.2;
}
.benefit-stat-label {
  font-size: 10px;
  color: #999;
  margin-top: 2px;
}
.benefit-stat-green .benefit-stat-num { color: #00A854; }

/* 赠品卡片 */
.gift-card {
  border: 1.5px solid #FFE0B2;
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 14px;
  background: #fff;
}
.gift-card-header {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 6px;
}
.gift-icon {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FF6B00, #FFB800);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  flex-shrink: 0;
}
.gift-title {
  font-size: 14px;
  font-weight: 700;
  color: #111;
}
.gift-amount {
  font-size: 22px;
  font-weight: 900;
  color: #E8001C;
  line-height: 1.2;
}
.gift-amount span { font-size: 13px; font-weight: 500; color: #E8001C; }

/* 立即体验按钮区 */
.cta-wrap {
  padding: 0 0 10px;
  background: #fff;
  position: relative;
}
.cta-btn-outer {
  position: relative;
  margin: 0 0 6px;
}
.cta-btn {
  width: 100%;
  height: 50px;
  background: linear-gradient(90deg, #FFD000 0%, #FFBE00 100%);
  border-radius: 25px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 800;
  color: #333;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255,190,0,0.45);
  letter-spacing: 1px;
  transition: opacity 0.2s;
}
.cta-btn:active { opacity: 0.85; }
.cta-tag {
  position: absolute;
  top: -8px; right: 10px;
  background: #E8001C;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 8px;
  letter-spacing: 0.3px;
}
.cta-hint {
  text-align: center;
  font-size: 10px;
  color: #bbb;
  padding-bottom: 4px;
}
.cta-hint a { color: #E8001C; text-decoration: none; }

/* 时间轴 */
.timeline-wrap {
  background: #fff;
  padding: 14px 16px 14px;
  margin-top: 8px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  position: relative;
}
.timeline-wrap::before {
  content: '';
  position: absolute;
  top: 22px; left: 50px; right: 50px;
  height: 1px;
  background: #f0f0f0;
}
.tl-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  position: relative;
  z-index: 1;
}
.tl-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FF6B00, #FFB800);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.tl-label {
  font-size: 11px;
  font-weight: 600;
  color: #333;
  text-align: center;
}
.tl-date {
  font-size: 10px;
  color: #aaa;
  text-align: center;
}

/* 保障详情 */
.coverage-wrap {
  background: #fff;
  margin-top: 8px;
  padding: 14px 16px;
}
.coverage-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.coverage-title {
  font-size: 15px;
  font-weight: 700;
  color: #111;
}
.coverage-more {
  font-size: 13px;
  color: #1677FF;
}
.coverage-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid #f5f5f5;
  font-size: 13px;
  color: #333;
}
.coverage-row:last-child { border-bottom: none; }
.coverage-amount {
  font-size: 13px;
  color: #111;
  font-weight: 500;
}

/* 底部安全区占位 */
.page-bottom { height: 80px; background: #f7f7f7; }

/* 底部按钮（悬浮在页面上方） */
.submit-btn {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 80px;
  background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #fff 40%);
  display: flex; align-items: center; justify-content: center;
  padding-bottom: 16px;
  z-index: 5;
  pointer-events: none;
}
.btn-main {
  width: calc(100% - 32px);
  height: 50px;
  background: linear-gradient(90deg, #FFD000 0%, #FFBE00 100%);
  border-radius: 25px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: #333;
  box-shadow: 0 4px 16px rgba(255,190,0,0.45);
  letter-spacing: 1px;
  cursor: pointer;
  pointer-events: auto;
  position: relative;
}
.btn-main-tag {
  position: absolute;
  top: -8px; right: 14px;
  background: #E8001C;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 8px;
}

/* ── 遮罩 ── */
.mask {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0);
  transition: background 0.4s ease;
  pointer-events: none;
  z-index: 10;
  border-radius: 40px;
  /* 毛玻璃模糊背景 */
  backdrop-filter: blur(0px);
  -webkit-backdrop-filter: blur(0px);
}
.mask.show {
  background: rgba(8,4,24,0.55);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  pointer-events: auto;
}

/* ── 弹窗（无背景框，3D悬浮） ── */
.popup {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -38%) scale(0.8) rotateX(12deg);
  transform-style: preserve-3d;
  perspective: 800px;
  width: 320px;
  background: rgba(12, 18, 40, 0.82);
  border-radius: 20px;
  padding: 20px 14px 16px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 8px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.07);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  z-index: 20;
  opacity: 0;
  transition: opacity 0.45s ease, transform 0.5s cubic-bezier(0.22,1.2,0.36,1);
  pointer-events: none;
}
.popup.show {
  opacity: 1;
  transform: translate(-50%, -42%) scale(1) rotateX(0deg);
  pointer-events: auto;
}

/* 弹窗顶部图标 */
.popup-icon-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 12px;
  position: relative;
  z-index: 2;
}
.shield-wrap {
  position: relative;
  width: 44px; height: 44px;
  overflow: visible;
}
/* 面形光晕圈（实心圆，透明度渐出） */
.shield-ring {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,210,60,0.55) 0%, rgba(255,160,0,0.0) 68%);
  animation: shieldRing 2s ease-out infinite;
  border: none;
}
.shield-ring:nth-child(1) { width:58px;  height:58px;  top:-7px;  left:-7px;  animation-delay:0s; }
.shield-ring:nth-child(2) { width:74px;  height:74px;  top:-15px; left:-15px; animation-delay:0.65s; }
.shield-ring:nth-child(3) { width:90px;  height:90px;  top:-23px; left:-23px; animation-delay:1.3s; }
@keyframes shieldRing {
  0%   { opacity:1;   transform:scale(0.7); }
  60%  { opacity:0.55; }
  100% { opacity:0;   transform:scale(1.15); }
}
.shield-body {
  position: absolute;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, #FFD000, #FF8C00);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(255,180,0,0.55), 0 0 0 3px rgba(255,210,0,0.25);
  animation: shieldPulse 2.5s ease-in-out infinite;
}
@keyframes shieldPulse {
  0%,100% { box-shadow: 0 4px 20px rgba(255,180,0,0.55), 0 0 0 3px rgba(255,210,0,0.25); }
  50%     { box-shadow: 0 4px 28px rgba(255,180,0,0.8),  0 0 0 5px rgba(255,210,0,0.35); }
}
.shield-svg { width: 24px; height: 24px; }

/* 弹窗标题 */
.popup-title {
  text-align: center;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 14px;
  letter-spacing: 0;
  white-space: nowrap;
  text-shadow: 0 2px 16px rgba(255,255,255,0.2);
}

/* 权益列表 */
.benefit-list { margin-bottom: 14px; }

.benefit-row {
  display: flex;
  align-items: center;
  padding: 5px 4px;
  margin-bottom: 6px;
  border-radius: 0;
  background: transparent;
  border: none;
  backdrop-filter: none;
  opacity: 0;
  transform: translateX(-20px);
  transition: opacity 0.45s ease, transform 0.45s cubic-bezier(0.34,1.3,0.64,1);
  box-shadow: none;
}
.benefit-row:last-child { margin-bottom: 0; }
.benefit-row.visible { opacity:1; transform:translateX(0); }
/* 入场后扫光 */
.benefit-row.sweep {
  background: transparent;
  transition: background 0.6s ease;
}

.row-icon {
  width: 18px; height: 18px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  font-weight: 800;
  flex-shrink: 0;
  margin-right: 7px;
}
.icon-orange { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25); }
.icon-blue   { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25); }
.icon-green  { background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.25); }

.row-text { flex: 1; }
.row-main { font-size: 12px; font-weight: 600; color: rgba(240,245,255,0.95); display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: nowrap; gap: 6px; }
.row-desc { font-size: 10px; color: rgba(210,215,230,0.65); margin-top: 1px; }

.row-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 600;
  color: rgba(210,215,230,0.65);
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
  flex-shrink: 0;
  align-self: flex-start;
}
.row-badge.show { opacity:1; transform:scale(1); }
.badge-check {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: #00C878;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 6px rgba(0,200,120,0.6);
}
.badge-check svg { width:8px; height:8px; }

/* 进度条 */
.progress-wrap { margin-bottom: 10px; }
.progress-track {
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
  margin-bottom: 8px;
}
.progress-fill {
  height: 100%;
  border-radius: 6px;
  background: linear-gradient(90deg, #FFB800 0%, #FFD000 60%, #fff5a0 100%);
  box-shadow: 0 0 10px rgba(255,210,0,0.7), 0 0 20px rgba(255,180,0,0.35);
  width: 0%;
  transition: width 0.4s ease;
  position: relative;
}

.progress-label {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 12px;
  color: rgba(180,200,240,0.75);
}
.arrow-bounce {
  color: #FF8C00;
  display: inline-block;
  animation: arrowBounce 0.7s ease-in-out infinite;
}
@keyframes arrowBounce {
  0%,100% { transform:translateX(0); }
  50% { transform:translateX(4px); }
}

/* 倒计时行隐藏 */
.countdown-row { display: none; }

/* 放弃按钮（常驻屏幕底部） */
.cancel-btn {
  text-align: center;
  font-size: 11px;
  color: rgba(220,225,240,0.7);
  cursor: pointer;
  transition: color 0.2s;
  text-decoration: underline;
  text-underline-offset: 2px;
  letter-spacing: 0.3px;
  margin-top: 10px;
}
.cancel-btn:hover { color: rgba(240,242,250,0.9); }

/* 支付密码底部 sheet（直接叠在手机壳内） */
.pay-sheet {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 20px 0 0;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.22);
  z-index: 40;
  transform: translateY(100%);
  transition: transform 0.38s cubic-bezier(0.32,1.1,0.4,1);
  pointer-events: none;
}
.pay-sheet.show {
  transform: translateY(0);
  pointer-events: auto;
}
.pay-sheet-title {
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  color: #111;
  margin-bottom: 20px;
  position: relative;
}
.pay-sheet-close {
  position: absolute;
  right: 20px; top: 0;
  font-size: 20px;
  color: #999;
  line-height: 1;
  cursor: pointer;
}
.pay-dots {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 0 20px 10px;
}
.pay-dot {
  flex: 1;
  height: 48px;
  background: #f5f5f5;
  border-radius: 8px;
  border: 1px solid #e8e8e8;
}
.pay-forget {
  text-align: right;
  padding: 0 20px;
  font-size: 13px;
  color: #1677FF;
  margin-bottom: 10px;
}
.pay-keyboard {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: #e0e0e0;
  border-top: 1px solid #e0e0e0;
}
.pay-key {
  background: #fff;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 400;
  color: #111;
}
.pay-key.empty { background: #f5f5f5; }
.pay-key.del { background: #f5f5f5; font-size:16px; color:#555; }

/* 密码面板拉起时隐藏弹窗内容 */
.popup.hide-for-pay {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.mask.dim-for-pay {
  background: rgba(8,4,24,0.75);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}

/* 放弃按钮（页面底部） */
.abandon-btn {
  position: absolute;
  bottom: 18px;
  left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  color: rgba(160,165,180,0.45);
  cursor: pointer;
  letter-spacing: 0.3px;
  z-index: 41;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.abandon-btn.show {
  opacity: 1;
  pointer-events: auto;
}

/* 完成态 */
.success-overlay {
  position: absolute;
  inset: -20px;
  border-radius: 20px;
  background: radial-gradient(ellipse at 50% 40%, rgba(0,220,130,0.18) 0%, transparent 70%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.5s ease;
}
.success-overlay.show { opacity: 1; }
</style>
</head>
<body>

<div class="phone">

<script>
  // ── 总时长 5s，权益逐条出现 + 进度条 + 倒计时 全部同步 ──
  const TOTAL_MS = 4500;   // 总时长与最后一个badge同步
  let startTime  = null;
  let rafId      = null;
  let cdInterval = null;
  let done       = false;

  // 权益行出现时间点：四条均匀分布在 0~4.5s
  const rowAt   = [200,  1200, 2200, 3200];   // 每条行入场时刻
  const badgeAt = [700,  1700, 2700, 4000];   // 每条 badge 出现时刻
  const rowDone  = [false, false, false, false];
  const badgeDone = [false, false, false, false];

  // 盾牌勾在第一条 badge 出现后亮起
  let shieldDone = false;

  function tick(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;

    // 进度条同步
    const pct = Math.min(elapsed / TOTAL_MS * 100, 100);
    document.getElementById('progressFill').style.width = pct + '%';

    // 权益行逐条入场
    rowAt.forEach((t, i) => {
      if (!rowDone[i] && elapsed >= t) {
        rowDone[i] = true;
        const el = document.getElementById('row' + i);
        el.classList.add('visible');
        setTimeout(() => el.classList.add('sweep'), 100);
      }
    });

    // badge 逐条出现
    badgeAt.forEach((t, i) => {
      if (!badgeDone[i] && elapsed >= t) {
        badgeDone[i] = true;
        document.getElementById('badge' + i).classList.add('show');
      }
    });

    // 盾牌勾
    if (!shieldDone && elapsed >= badgeAt[0] + 200) {
      shieldDone = true;
      const sc = document.getElementById('shieldCheck');
      sc.style.transition = 'opacity 0.5s ease';
      sc.style.opacity = '1';
    }

    if (elapsed < TOTAL_MS && !done) {
      rafId = requestAnimationFrame(tick);
    } else if (!done) {
      onComplete();
    }
  }

  function updateProgress() {} // 保留空函数避免报错

  function startActivation() {
    // 禁用热区，模糊背景图
    document.getElementById('startBtn').style.pointerEvents = 'none';
    document.getElementById('pageContent').classList.add('blurred');

    // 显示遮罩 + 弹窗
    const mask  = document.getElementById('mask');
    const popup = document.getElementById('popup');
    mask.classList.add('show');
    // 短暂延迟后弹窗入场（等遮罩先出现）
    setTimeout(() => {
      popup.classList.add('show');
      // 显示放弃按钮
      document.getElementById('cancelBtn').style.display = '';
      // 启动动效
      setTimeout(() => {
        requestAnimationFrame(tick);
      }, 300);
    }, 150);
  }

  function onComplete() {
    done = true;
    const fill = document.getElementById('progressFill');
    fill.classList.add('done');
    fill.style.width = '100%';

    // 完成态绿色光晕
    document.getElementById('successOverlay').classList.add('show');

    // 标题变绿
    document.getElementById('popupTitle').style.color = '#fff';
    document.getElementById('popupTitle').style.textShadow = '0 2px 16px rgba(255,255,255,0.2)';

    // 底部状态文字：结构与加载中一致，只换文案和颜色
    const statusEl = document.getElementById('statusText');
    statusEl.innerHTML =
      '<span style="color:#fff;font-weight:600;">所有权益已锁定</span>';
    // 隐藏停止领取按钮
    document.getElementById('cancelBtn').style.display = 'none';

    // 1s 后从底部滑出密码输入面板
    setTimeout(() => {
      // 隐藏弹窗内容，背景只保留虚化遗罩
      document.getElementById('popup').classList.add('hide-for-pay');
      document.getElementById('mask').classList.add('dim-for-pay');
      // 底部滑入密码面板
      document.getElementById('paySheet').classList.add('show');
      // 显示放弃按钮
      document.getElementById('abandonBtn').classList.add('show');
    }, 1000);
  }

  function cancelActivation() {
    if (done) return;
    cancelAnimationFrame(rafId);
    clearInterval(cdInterval);

    const popup = document.getElementById('popup');
    const mask  = document.getElementById('mask');

    // 弹窗淡出动画
    popup.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
    popup.style.opacity = '0';
    popup.style.transform = 'translate(-50%, -44%) scale(0.9)';
    mask.style.transition = 'background 0.25s ease';
    mask.style.background = 'rgba(0,0,0,0)';

    setTimeout(() => {
      // 隐藏遮罩 & 背景
      mask.classList.remove('show');
      document.getElementById('pageContent').classList.remove('blurred');

      // 清除 popup 所有 inline style，恢复 CSS class 控制
      popup.removeAttribute('style');
      popup.classList.remove('show', 'hide-for-pay');
      mask.removeAttribute('style');
      mask.classList.remove('dim-for-pay');

      // 重置进度条
      const fill = document.getElementById('progressFill');
      fill.style.width = '0%';
      fill.classList.remove('done');

      // 重置成功光晕
      document.getElementById('successOverlay').classList.remove('show');

      // 重置每行动画状态
      for (let i = 0; i < 4; i++) {
        const el = document.getElementById('row' + i);
        if (el) { el.classList.remove('visible', 'sweep'); }
        const badge = el ? el.querySelector('.row-badge') : null;
        if (badge) badge.classList.remove('show');
        rowDone[i]   = false;
        badgeDone[i] = false;
      }

      // 重置盾牌图标
      const sc = document.getElementById('shieldCheck');
      if (sc) sc.style.opacity = '0';
      shieldDone = false;

      // 重置标题 & 状态文字
      document.getElementById('popupTitle').removeAttribute('style');
      const statusEl = document.getElementById('statusText');
      if (statusEl) statusEl.innerHTML =
        '<span class="arrow-bounce">→</span><span>即将验证身份领取保障权益</span>';

      // 隐藏放弃按钮
      document.getElementById('cancelBtn').style.display = 'none';
      document.getElementById('abandonBtn').classList.remove('show');

      // 收起支付面板
      document.getElementById('paySheet').classList.remove('show');

      // 重置热区（允许再次点击）
      document.getElementById('startBtn').style.pointerEvents = '';

      // 重置所有状态变量
      done       = false;
      startTime  = null;
      rafId      = null;
      cdInterval = null;
    }, 260);
  }
</script>
</body>
</html>
